[project]
name = "diffusion_linking"
version = "0.0.1"
description = "Research on entity linking using SMC and diffusion models."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flax",
    "jax",
    "jaxlib",
    "matplotlib",
    "nltk",
    "optax",
    "seaborn",
    "torch",
    "tqdm",
    "unidecode",
]

[build-system]
requires = ["uv_build>=0.7.19,<0.8.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["jupyter", "pyright", "pytest", "pytest-mock", "ruff"]

[tool.pyright]
typeCheckingMode = "standard"
useLibraryCodeForTypes = false
pythonVersion = "3.12"
exclude = ["**/__pycache__", "**/.*"]
